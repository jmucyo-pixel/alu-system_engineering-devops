<!DOCTYPE html>
<html lang="en">
  <head>
    <title>404 - Lost in Translation</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;1,400;1,500&display=swap");

      :root {
        --bg-cream: #fdfaf3;
        --bg-mid: #f7f0dd;
        --gold: #b8860b;
        --gold-bright: #d4af37;
        --gold-glow: rgba(212, 175, 55, 0.25);
        --text: #141210;
        --text-dim: rgba(20, 18, 16, 0.55);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: linear-gradient(150deg, var(--bg-cream) 0%, var(--bg-mid) 100%);
        font-family: "Cormorant Garamond", serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        color: var(--text);
        overflow: hidden;
        position: relative;
      }

      /* Subtle texture overlay */
      body::after {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3%3Cfilter id='noiseFilter'%3%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3%3C/filter%3%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3%3C/svg%3");
        opacity: 0.03;
        pointer-events: none;
        z-index: 10;
      }

      /* Floating Ambient Orbs, softened gold glow instead of teal */
      .orb {
        position: absolute;
        width: 60vh;
        height: 60vh;
        border-radius: 50%;
        filter: blur(110px);
        opacity: 0.35;
        z-index: 0;
        animation: rotate 20s linear infinite;
      }

      .orb-1 {
        background: var(--gold-bright);
        top: -10%;
        left: -10%;
      }

      .orb-2 {
        background: #e6d5a8;
        bottom: -15%;
        right: -10%;
        animation-direction: reverse;
        animation-duration: 25s;
      }

      @keyframes rotate {
        0% { transform: translate(0, 0) scale(1); }
        33% { transform: translate(50px, -50px) scale(1.1); }
        66% { transform: translate(-30px, 40px) scale(0.9); }
        100% { transform: translate(0, 0) scale(1); }
      }

      main {
        position: relative;
        z-index: 5;
        width: 100%;
        max-width: 540px;
        padding: 3.5rem 3rem;
        background: rgba(255, 255, 255, 0.55);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--gold-bright);
        border-radius: 8px;
        text-align: center;
        box-shadow: 0 40px 100px rgba(184, 134, 11, 0.18);
        animation: slideUp 1.2s cubic-bezier(0.2, 0.8, 0.2, 1);
        position: relative;
      }

      /* Ornamental corner accents for a heraldic, coachbuilt feel */
      main::before,
      main::after {
        content: "";
        position: absolute;
        width: 26px;
        height: 26px;
        border: 1px solid var(--gold-bright);
      }
      main::before {
        top: 12px;
        left: 12px;
        border-right: none;
        border-bottom: none;
      }
      main::after {
        bottom: 12px;
        right: 12px;
        border-left: none;
        border-top: none;
      }

      @keyframes slideUp {
        from { opacity: 0; transform: translateY(40px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .status-tag {
        display: inline-block;
        padding: 0.5rem 1.4rem;
        background: rgba(212, 175, 55, 0.12);
        border: 1px solid var(--gold);
        border-radius: 100px;
        font-family: "Cinzel", serif;
        font-size: 0.68rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.25em;
        color: var(--gold);
        margin-bottom: 2.2rem;
      }

      .big-text {
        font-family: "Cinzel", serif;
        font-size: 4.6rem;
        font-weight: 700;
        line-height: 1;
        margin-bottom: 1.2rem;
        letter-spacing: 0.06em;
        color: var(--text);
        text-shadow: 0 1px 0 rgba(255,255,255,0.6);
      }

      .line {
        width: 50px;
        height: 1px;
        background: var(--gold-bright);
        margin: 2rem auto;
      }

      .artistic-quote {
        font-family: "Cormorant Garamond", serif;
        font-style: italic;
        font-weight: 500;
        font-size: 1.7rem;
        color: var(--text);
        margin-bottom: 1.5rem;
        position: relative;
        display: inline-block;
      }

      .artistic-quote::after {
        content: "";
        position: absolute;
        bottom: -8px;
        left: 0;
        width: 100%;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--gold), transparent);
      }

      .translation {
        font-family: "Cinzel", serif;
        font-size: 0.72rem;
        color: var(--text-dim);
        margin-bottom: 2.5rem;
        font-weight: 400;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }

      .actions {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        align-items: center;
      }

      .btn {
        text-decoration: none;
        font-family: "Cinzel", serif;
        font-weight: 600;
        font-size: 0.78rem;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        padding: 1.2rem 3rem;
        border-radius: 2px;
        width: 100%;
      }

      .btn-primary {
        background: linear-gradient(135deg, var(--gold-bright), var(--gold));
        color: #fdfaf3;
        box-shadow: 0 10px 20px var(--gold-glow);
        border: 1px solid var(--gold);
      }

      .btn-primary:hover {
        transform: translateY(-4px);
        box-shadow: 0 15px 30px var(--gold-glow);
        filter: brightness(1.05);
      }

      .btn-secondary {
        color: var(--text);
        border: 1px solid rgba(20, 18, 16, 0.2);
        background: rgba(255, 255, 255, 0.4);
      }

      .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.7);
        border-color: var(--gold);
      }

      .footer-id {
        margin-top: 3rem;
        font-family: "Cinzel", serif;
        font-size: 0.6rem;
        text-transform: uppercase;
        letter-spacing: 0.35em;
        color: rgba(20, 18, 16, 0.35);
      }
    </style>
  </head>
  <body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <main>
      <div class="status-tag">Error Protocol 404</div>
      <h1 class="big-text">Void</h1>
      
      <div class="artistic-quote">Ceci n'est pas une page</div>
      <p class="translation">This is not a page</p>

      <div class="actions">
        <a href="/" class="btn btn-primary">Return to Reality</a>
        <a href="mailto:support@joelm.tech" class="btn btn-secondary">Report Drift</a>
      </div>

      <p class="footer-id">Ref: ALX-WEB-01 // SERVER-NODE-9</p>
    </main>
  </body>
</html>
